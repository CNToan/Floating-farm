let scene,camera,renderer,controls,clock, islandGroup, slime, selected=false, quality='HIGH', elapsed=0, cycle=0.28, lastFrame=0, frames=0, fpsTimer=0;
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2(); const obstacles=[]; const grassInstances=[]; const fireflies=[]; const flowerGroups=[]; const worldRadius=22;
const tempObj=new THREE.Object3D(), tempColor=new THREE.Color();
function terrainHeight(x,z){return 0.22*Math.sin(x*.22)*Math.cos(z*.19)+0.13*Math.sin(z*.38+x*.13)+0.06*Math.cos(x*.65-z*.32)}

function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color('#9bd8fa');scene.fog=new THREE.Fog('#b9e6f6',48,105);

 scene.add(new THREE.HemisphereLight(0xe5f7ff,0x59744a,1.5));const sun=new THREE.DirectionalLight(0xfff4dc,2.5);sun.position.set(-25,38,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-34;sun.shadow.camera.right=34;sun.shadow.camera.top=34;sun.shadow.camera.bottom=-34;sun.shadow.bias=-.00025;scene.add(sun);scene.add(sun.target);scene.userData.sun=sun;

function createIsland(){

 for(let ring=0;ring<R;ring++)for(let i=0;i<N;i++){const a=ring*N+i,b=ring*N+(i+1)%N,c=(ring+1)*N+i,d=(ring+1)*N+(i+1)%N;indices.push(a,b,c,b,d,c)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();const top=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));top.receiveShadow=true;top.castShadow=true;islandGroup.add(top);
 // underside shell starts at the same perimeter coordinates: no floating grass-carpet seam.
 const shellV=[],shellI=[];for(let layer=0;layer<5;layer++){const t=layer/4;for(let i=0;i<N;i++){const a=i/N*Math.PI*2,rr=edgeRadius(a),x=Math.cos(a)*rr*(1-t*.12),z=Math.sin(a)*rr*(1-t*.12),y=ground(x,z)-(.25+t*(3.1+.35*Math.sin(a*4)));shellV.push(x,y,z)}}
 for(let l=0;l<4;l++)for(let i=0;i<N;i++){const a=l*N+i,b=l*N+(i+1)%N,c=(l+1)*N+i,d=(l+1)*N+(i+1)%N;shellI.push(a,b,c,b,d,c)}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(shellV,3));sg.setIndex(shellI);sg.computeVertexNormals();const shell=new THREE.Mesh(sg,[makeMat('#79513a'),makeMat('#4f5540')]);shell.material=makeMat('#76513a');shell.castShadow=true;shell.receiveShadow=true;islandGroup.add(shell);
 // Irregular earthy ledges and exposed stones along the island underside.
 for(let i=0;i<42;i++){const a=i/42*Math.PI*2,r=edgeRadius(a)*rand(.88,1.02),x=Math.cos(a)*r,z=Math.sin(a)*r,y=ground(x,z)-rand(1.0,2.8);const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.35,.85),1),makeMat(i%3?'#80634a':'#68705a'));rock.position.set(x,y,z);rock.scale.set(rand(.8,1.4),rand(.5,1),rand(.8,1.3));rock.rotation.set(rand(-.3,.3),rand(0,6),rand(-.3,.3));islandGroup.add(rock)}
 // subtle soil patches
 const soilMat=[makeMat('#92714a'),makeMat('#a18459'),makeMat('#6e6948')];for(let i=0;i<34;i++){let p=randomGround(.15);const m=new THREE.Mesh(new THREE.CircleGeometry(rand(.45,1.25),12),soilMat[i%3]);m.rotation.x=-Math.PI/2;m.rotation.z=rand(0,6);m.position.set(p.x,ground(p.x,p.z)+.018,p.z);m.scale.set(rand(.8,1.6),rand(.6,1.15),1);islandGroup.add(m)}
}
function randomGround(min=0){for(let n=0;n<100;n++){const a=rand(0,Math.PI*2),r=Math.sqrt(rand(min*min,.91))*edgeRadius(a);const x=Math.cos(a)*r,z=Math.sin(a)*r;if(insideIsland(x,z,1.2))return{x,z}}return{x:0,z:0}}
function createFence(){const postMat=makeMat('#9a6032'),railMat=makeMat('#ad7540');const count=74;const pts=[];for(let i=0;i<=count;i++){const a=i/count*Math.PI*2,r=edgeRadius(a)-.25;pts.push(new THREE.Vector3(Math.cos(a)*r,ground(Math.cos(a)*r,Math.sin(a)*r),Math.sin(a)*r))}
 for(let i=0;i<count;i++){const p=pts[i],q=pts[i+1],mid=p.clone().add(q).multiplyScalar(.5),dir=q.clone().sub(p);const post=new THREE.Mesh(new THREE.CylinderGeometry(.22,.25,1.55,9,1),postMat);post.position.set(p.x,p.y+.72,p.z);post.rotation.z=rand(-.045,.045);post.castShadow=true;islandGroup.add(post);
 for(let h of [.48,1.02]){const rail=new THREE.Mesh(new THREE.BoxGeometry(dir.length()+.12,.22,.19),railMat);rail.position.set(mid.x,mid.y+h,mid.z);rail.rotation.y=-Math.atan2(dir.z,dir.x);rail.rotation.z=dir.y*.2;rail.castShadow=true;islandGroup.add(rail)}}}
function createGrass(){const count=quality==='LOW'?4800:quality==='MEDIUM'?8500:12500;const bladeGeo=new THREE.BufferGeometry();const v=[0,0,0,-.11,.16,0,-.075,.48,0,0,.72,0, 0,0,0,.11,.16,0,.075,.48,0,0,.72,0];const idx=[0,1,2,2,1,3,4,6,5,6,7,5];bladeGeo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));bladeGeo.setAttribute('color',new THREE.Float32BufferAttribute(new Array(8*3).fill(1),3));bladeGeo.setIndex(idx);bladeGeo.computeVertexNormals();
 const mat=new THREE.MeshStandardMaterial({color:'#6fbf43',side:THREE.DoubleSide,roughness:.92,vertexColors:true});const mesh=new THREE.InstancedMesh(bladeGeo,mat,count);mesh.castShadow=false;mesh.receiveShadow=true;const colorAttr=new THREE.InstancedBufferAttribute(new Float32Array(count*3),3);mesh.instanceColor=colorAttr;
 for(let i=0;i<count;i++){const p=randomGround(.06),h=rand(.42,1.25),w=rand(.55,1.35),rot=rand(0,Math.PI*2);tempObj.position.set(p.x,ground(p.x,p.z)+.025,p.z);tempObj.rotation.set(rand(-.1,.1),rot,rand(-.18,.18));tempObj.scale.set(w,h,w);tempObj.updateMatrix();mesh.setMatrixAt(i,tempObj.matrix);const col=new THREE.Color().setHSL(rand(.235,.31),rand(.42,.66),rand(.32,.49));mesh.setColorAt(i,col)}islandGroup.add(mesh);grassInstances.push(mesh);

function createFlowers(){const palettes=[['#fff6e8','#e9b93d'],['#ffd95d','#df9b28'],['#cda5ef','#f3d66e'],['#f5a9bd','#f6d66e']];const n=quality==='LOW'?45:quality==='MEDIUM'?85:125;for(let i=0;i<n;i++){const p=randomGround(.12);let near=false;for(const o of obstacles)if(Math.hypot(p.x-o.x,p.z-o.z)<o.r+1)near=true;if(near)continue;const group=new THREE.Group();const stemH=rand(.28,.7),stem=new THREE.Mesh(new THREE.CylinderGeometry(.018,.025,stemH,5),makeMat('#4f9a45'));stem.position.y=stemH/2;group.add(stem);const type=i%4,[petal,center]=palettes[type],petalMat=makeMat(petal,.65),centerMat=makeMat(center,.6);const petals=type===2?6:5;for(let j=0;j<petals;j++){const a=j/petals*Math.PI*2;const pet=new THREE.Mesh(new THREE.SphereGeometry(1,10,7),petalMat);pet.scale.set(.12,.045,.23);pet.position.set(Math.cos(a)*.16,stemH+.015,Math.sin(a)*.16);pet.rotation.y=-a;pet.rotation.z=Math.cos(a)*-.25;group.add(pet)}const disk=new THREE.Mesh(new THREE.SphereGeometry(.085,12,8),centerMat);disk.position.y=stemH+.045;group.add(disk);const leaf=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),makeMat('#65a94c'));leaf.scale.set(.11,.035,.22);leaf.position.set(.08,stemH*.45,.03);leaf.rotation.y=.7;group.add(leaf);group.position.set(p.x,ground(p.x,p.z)+.025,p.z);group.rotation.y=rand(0,6);group.scale.setScalar(rand(.75,1.25));group.userData.phase=rand(0,6);islandGroup.add(group);flowerGroups.push(group)}}
function createRocks(){const rockMats=['#8d928c','#9c9586','#777f7b','#a39b8b'].map(c=>makeMat(c,.96));const n=quality==='LOW'?23:quality==='MEDIUM'?34:46;for(let i=0;i<n;i++){const p=randomGround(.12),size=rand(.35,1.2);const geo=new THREE.IcosahedronGeometry(size,1);const pos=geo.attributes.position;for(let j=0;j<pos.count;j++){const f=rand(.86,1.14);pos.setXYZ(j,pos.getX(j)*f,pos.getY(j)*rand(.8,1.15),pos.getZ(j)*rand(.85,1.12))}geo.computeVertexNormals();const rock=new THREE.Mesh(geo,rockMats[i%rockMats.length]);rock.position.set(p.x,ground(p.x,p.z)+size*.28,p.z);rock.scale.set(rand(.85,1.35),rand(.65,1),rand(.85,1.3));rock.rotation.set(rand(-.15,.15),rand(0,6),rand(-.12,.12));rock.castShadow=true;rock.receiveShadow=true;islandGroup.add(rock);obstacles.push({x:p.x,z:p.z,r:size*1.15});if(i%3===0){const moss=new THREE.Mesh(new THREE.SphereGeometry(size*.48,10,7),makeMat('#63864a'));moss.scale.set(1,.12,.72);moss.position.set(p.x+size*.15,rock.position.y+size*.58,p.z-size*.1);moss.rotation.y=rand(0,6);islandGroup.add(moss)}}}
function createSlime(){slime=new THREE.Group();const bodyMat=new THREE.MeshPhysicalMaterial({color:'#45dce0',roughness:.19,metalness:0,clearcoat:.9,clearcoatRoughness:.12,transmission:.12,thickness:.7,ior:1.28});const body=new THREE.Mesh(new THREE.SphereGeometry(1,48,36),bodyMat);body.scale.set(1.28,.86,1.12);body.position.y=.87;body.castShadow=true;body.receiveShadow=true;slime.add(body);slime.userData.body=body;
 const face=new THREE.Group();face.position.set(0,1.02,1.06);slime.add(face);
 const heartShape=new THREE.Shape();heartShape.moveTo(0,-.09);heartShape.bezierCurveTo(-.22,.08,-.2,.26,-.06,.25);heartShape.bezierCurveTo(0,.25,.04,.19,0,.15);heartShape.bezierCurveTo(.14,.3,.28,.17,.2,.02);heartShape.bezierCurveTo(.16,-.04,.07,-.1,0,-.09);const heartGeo=new THREE.ExtrudeGeometry(heartShape,{depth:.045,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.018,bevelThickness:.02});const eyeMat=new THREE.MeshStandardMaterial({color:'#163d58',roughness:.22});for(let x of [-.36,.36]){const eye=new THREE.Mesh(heartGeo,eyeMat);eye.scale.set(.62,.62,.62);eye.position.set(x,.04,0);eye.rotation.z=x<0?-.12:.12;face.add(eye);const glint=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),new THREE.MeshBasicMaterial({color:'#ffffff'}));glint.position.set(x-.035,.14,.055);face.add(glint)}
 const mouthCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-.13,-.18,.02),new THREE.Vector3(-.05,-.22,.03),new THREE.Vector3(0,-.17,.03),new THREE.Vector3(.06,-.22,.03),new THREE.Vector3(.14,-.18,.02)]);const mouth=new THREE.Mesh(new THREE.TubeGeometry(mouthCurve,18,.018,6,false),new THREE.MeshStandardMaterial({color:'#246f77'}));face.add(mouth);
 // Silver crown: curved band + five shaped prongs + amethyst jewel.

 const prongShape=new THREE.Shape();prongShape.moveTo(-.11,0);prongShape.lineTo(-.09,.24);prongShape.quadraticCurveTo(0,.34,.09,.24);prongShape.lineTo(.11,0);prongShape.close();const prongGeo=new THREE.ExtrudeGeometry(prongShape,{depth:.055,bevelEnabled:true,bevelSegments:2,bevelSize:.018,bevelThickness:.018});for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;const pr=new THREE.Mesh(prongGeo,silver);pr.position.set(Math.sin(a)*.42,.07,Math.cos(a)*.31);pr.rotation.y=a;pr.scale.set(i===0?1.18:.85,i===0?1.2:.85,1);crown.add(pr)}
 const gemMat=new THREE.MeshPhysicalMaterial({color:'#9b59e8',metalness:.25,roughness:.12,clearcoat:1});const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.16,0),gemMat);gem.position.set(0,.22,.39);gem.scale.set(.85,1.2,.55);crown.add(gem);const gemBase=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),silver);gemBase.position.set(0,.15,.37);gemBase.scale.set(1,.55,.5);crown.add(gemBase);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.55,.035,8,64),new THREE.MeshBasicMaterial({color:'#a9fff0',transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2;ring.position.y=.035;ring.visible=false;slime.add(ring);slime.userData.ring=ring;slime.userData.crown=crown;slime.position.set(-1,0,1);islandGroup.add(slime);
}
function createFireflies(){const geo=new THREE.SphereGeometry(.055,8,6),mat=new THREE.MeshBasicMaterial({color:'#d8ff9b'});const n=quality==='LOW'?12:quality==='MEDIUM'?22:34;for(let i=0;i<n;i++){const m=new THREE.Mesh(geo,mat);const p=randomGround(.1);m.position.set(p.x,ground(p.x,p.z)+rand(.5,2.5),p.z);m.userData={base:m.position.clone(),phase:rand(0,8),speed:rand(.35,.8)};scene.add(m);fireflies.push(m)}}
function createBackground(){const cloudMat=new THREE.MeshStandardMaterial({color:'#fff',roughness:1,transparent:true,opacity:.72});for(let i=0;i<9;i++){const g=new THREE.Group();for(let j=0;j<5;j++){const c=new THREE.Mesh(new THREE.SphereGeometry(rand(1.2,2.2),12,8),cloudMat);c.position.set(j*1.4,rand(-.2,.4),rand(-.5,.5));c.scale.y=.45;g.add(c)}g.position.set(rand(-55,55),rand(22,34),rand(-55,55));scene.add(g);g.userData.drift=rand(.2,.55);fireflies.push(g)}}
function pickSlime(e){const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(slime,true);if(hits.length){selected=!selected;slime.userData.ring.visible=selected;$('#info').classList.toggle('show',selected);if(selected){slime.userData.destination=null;slime.userData.state='idle';toast('Aqua Star đang chú ý đến bạn ♡')}else{slime.userData.wait=rand(5,10)}}else if(selected){selected=false;slime.userData.ring.visible=false;$('#info').classList.remove('show');slime.userData.wait=rand(5,10)}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
function updateSlime(dt,t){const u=slime.userData,body=u.body;u.wait=(u.wait??2)-dt;if(!selected){if(!u.destination&&u.wait<=0){for(let tries=0;tries<25;tries++){const a=rand(0,Math.PI*2),d=rand(2.5,8),x=slime.position.x+Math.cos(a)*d,z=slime.position.z+Math.sin(a)*d;if(!insideIsland(x,z,2))continue;let blocked=obstacles.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+1);if(!blocked){u.destination=new THREE.Vector3(x,0,z);u.state='walk';break}}u.wait=rand(5,10)}if(u.destination){const dx=u.destination.x-slime.position.x,dz=u.destination.z-slime.position.z,dist=Math.hypot(dx,dz);if(dist<.18){u.destination=null;u.state='idle';u.wait=rand(5,10)}else{const speed=2.05;slime.position.x+=dx/dist*Math.min(dist,speed*dt);slime.position.z+=dz/dist*Math.min(dist,speed*dt);slime.rotation.y=Math.atan2(dx,dz);}}}
 const walking=!selected&&u.destination;const bounce=walking?Math.abs(Math.sin(t*8))*.13:Math.sin(t*2.1)*.025;body.scale.y=.86+bounce+(walking?.08:0);body.scale.x=1.28-(walking?.055:0)+Math.sin(t*8)*.025;body.scale.z=1.12+(walking?.04:0);body.position.y=.87+bounce*.4;u.crown.rotation.z=Math.sin(t*(walking?8:2))*(walking?.055:.018);u.crown.position.y=1.73+bounce*.45;slime.position.y=walking?Math.abs(Math.sin(t*8))*.045:0;u.ring.rotation.z+=dt*.18;
}
function updateDay(dt){cycle=(cycle+dt/1440)%1;const h=cycle*24;let phase,sky,amb,sun,exp;if(h<6){phase='Bình minh';const t=h/6;sky=new THREE.Color('#233d69').lerp(new THREE.Color('#a8ddfa'),t);amb=lerp(.45,1.35,t);sun=lerp(.45,2.15,t);exp=lerp(.78,1.1,t)}else if(h<12){phase='Ban ngày';const t=(h-6)/6;sky=new THREE.Color('#a8ddfa').lerp(new THREE.Color('#8bcdf4'),t*.3);amb=1.35;sun=2.15;exp=1.1}else if(h<18){phase='Hoàng hôn';const t=(h-12)/6;sky=new THREE.Color('#8bcdf4').lerp(new THREE.Color('#e69a79'),t);amb=lerp(1.35,.55,t);sun=lerp(2.15,.5,t);exp=lerp(1.1,.82,t)}else{phase='Ban đêm';const t=(h-18)/6;sky=new THREE.Color('#e69a79').lerp(new THREE.Color('#172c55'),t);amb=lerp(.55,.35,t);sun=lerp(.5,.12,t);exp=lerp(.82,.72,t)}scene.background.copy(sky);scene.fog.color.copy(sky).lerp(new THREE.Color('#c3e7ef'),.3);scene.userData.sun.intensity=sun;renderer.toneMappingExposure=exp;$('#phase').textContent=(h<6?'🌅 ':h<12?'☀ ':h<18?'🌇 ':'✦ ')+phase;const night=clamp((h-17)/2,0,1)*(1-clamp((h-23)/2,0,1));fireflies.forEach(o=>{if(o.userData.base){const p=o.userData; o.position.x=p.base.x+Math.sin(elapsed*p.speed+p.phase)*.7;o.position.y=p.base.y+Math.sin(elapsed*.8+p.phase)*.4;o.position.z=p.base.z+Math.cos(elapsed*.6+p.phase)*.7;o.visible=night>.15;o.scale.setScalar(.6+night*.8)}})}
function setQuality(q){quality=q;renderer.setPixelRatio(Math.min(devicePixelRatio,q==='HIGH'?1.65:q==='MEDIUM'?1.25:1));renderer.shadowMap.enabled=q!=='LOW';scene.userData.sun.castShadow=q==='HIGH';$('#quality').textContent='Graphics: '+q;$('#settings').classList.remove('show');toast('Đã áp dụng đồ họa '+q);$('#settings').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.q===q));}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;controls.update();updateSlime(dt,elapsed);updateDay(dt);flowerGroups.forEach(f=>{f.rotation.z=Math.sin(elapsed*1.2+f.userData.phase)*.045});renderer.render(scene,camera);frames++;fpsTimer+=dt;if(fpsTimer>1){$('#fps').textContent='● '+Math.round(frames/fpsTimer)+' FPS';frames=0;fpsTimer=0}}
$('#reset').onclick=()=>{camera.position.set(30,27,34);controls.target.set(0,1,0);controls.update();toast('Đã đưa camera về vị trí ban đầu')};$('#zin').onclick=()=>{camera.position.lerp(controls.target,.13);controls.update()};$('#zout').onclick=()=>{const d=camera.position.clone().sub(controls.target);camera.position.copy(controls.target).add(d.multiplyScalar(1.13));controls.update()};$('#quality').onclick=()=>$('#settings').classList.toggle('show');$('#settings').querySelectorAll('button').forEach(b=>b.onclick=()=>setQuality(b.dataset.q));$('#skip').onclick=()=>{cycle=(cycle+3/1440)%1;toast('Đã tua nhanh 3 phút trong thế giới')};$('#close').onclick=()=>{selected=false;slime.userData.ring.visible=false;$('#info').classList.remove('show');slime.userData.wait=rand(5,10)};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65))});
try{init();}catch(err){console.error(err);$('#loading').innerHTML='Không thể khởi tạo 3D<small>Hãy tải lại trang và kiểm tra kết nối Internet.</small>'}
</script></body></html>
