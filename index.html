<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Floating Farm</title>
<style>
  html, body { margin: 0; height: 100%; background: #6fb3e8; overflow: hidden; touch-action: manipulation; }
  #game { width: 100%; height: 100%; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
// ===== CẤU HÌNH (sau này chỉnh số ở đây) =====
const CONFIG = {
  gridSize: 4,       // lưới 4x4
  tileW: 70,         // chiều rộng 1 ô (hình thoi)
  tileH: 35,         // chiều cao 1 ô
  originX: 180,      // vị trí đỉnh trên của lưới
  originY: 200
};

class FarmScene extends Phaser.Scene {
  constructor() { super('farm'); }

  create() {
    this.selected = null;
    this.drawIsland();
    this.tiles = this.add.graphics();
    this.infoText = this.add.text(180, 40, 'Chạm vào một ô đất', {
      fontFamily: 'sans-serif', fontSize: '20px', color: '#ffffff',
      stroke: '#000000', strokeThickness: 4
    }).setOrigin(0.5);
    this.drawTiles();

    this.input.on('pointerdown', (p) => {
      const cell = this.screenToTile(p.worldX, p.worldY);
      this.selected = cell;
      this.infoText.setText(cell ? 'Đã chọn ô hàng ' + (cell.r + 1) + ', cột ' + (cell.c + 1)
                                 : 'Chạm vào một ô đất');
      this.drawTiles();
    });
  }

  // Tọa độ ô (c, r) -> tọa độ màn hình (tâm ô)
  tileToScreen(c, r) {
    const { tileW, tileH, originX, originY } = CONFIG;
    return {
      x: originX + (c - r) * tileW / 2,
      y: originY + tileH / 2 + (c + r) * tileH / 2
    };
  }

  // Tọa độ chạm trên màn hình -> ô (c, r), hoặc null nếu chạm ngoài lưới
  screenToTile(x, y) {
    const { tileW, tileH, originX, originY, gridSize } = CONFIG;
    const a = (x - originX) / (tileW / 2);
    const b = (y - originY - tileH / 2) / (tileH / 2);
    const c = Math.round((a + b) / 2);
    const r = Math.round((b - a) / 2);
    if (c < 0 || r < 0 || c >= gridSize || r >= gridSize) return null;
    return { c, r };
  }

  drawDiamond(g, cx, cy, w, h) {
    g.beginPath();
    g.moveTo(cx, cy - h / 2);
    g.lineTo(cx + w / 2, cy);
    g.lineTo(cx, cy + h / 2);
    g.lineTo(cx - w / 2, cy);
    g.closePath();
    g.fillPath();
    g.strokePath();
  }

  drawIsland() {
    const g = this.add.graphics();
    // Đá dưới đáy đảo
    g.fillStyle(0x6b6b7a, 1);
    g.fillPoints([{x:20,y:270},{x:180,y:350},{x:340,y:270},{x:300,y:330},{x:180,y:420},{x:60,y:330}], true);
    // Lớp đất bên hông
    g.fillStyle(0x8a5a2b, 1);
    g.fillPoints([{x:20,y:270},{x:180,y:350},{x:180,y:385},{x:20,y:305}], true);
    g.fillStyle(0x6e4520, 1);
    g.fillPoints([{x:340,y:270},{x:180,y:350},{x:180,y:385},{x:340,y:305}], true);
    // Mặt cỏ
    g.fillStyle(0x5fbf4a, 1);
    g.fillPoints([{x:180,y:190},{x:340,y:270},{x:180,y:350},{x:20,y:270}], true);
  }

  drawTiles() {
    const g = this.tiles;
    g.clear();
    for (let r = 0; r < CONFIG.gridSize; r++) {
      for (let c = 0; c < CONFIG.gridSize; c++) {
        const p = this.tileToScreen(c, r);
        const isSel = this.selected && this.selected.c === c && this.selected.r === r;
        g.fillStyle(isSel ? 0xf2d16b : 0x9a6a3a, 1);
        g.lineStyle(2, isSel ? 0xffffff : 0x6e4520, 1);
        this.drawDiamond(g, p.x, p.y, CONFIG.tileW - 2, CONFIG.tileH - 1);
      }
    }
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  backgroundColor: '#6fb3e8',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: 360,
    height: 640
  },
  scene: FarmScene
});
</script>
</body>
</html>
